<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVENZO | لوحة الإدارة</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080808;
  color:white;
  padding:25px;
}

.container{
  max-width:850px;
  margin:auto;
}

h1{
  text-align:center;
  color:#d4af37;
  margin-bottom:30px;
}

.panel{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:25px;
  margin-bottom:25px;
}

.panel h2{
  color:#d4af37;
  margin-bottom:20px;
}

label{
  display:block;
  margin:15px 0 7px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:6px;
  border:1px solid #444;
  background:#181818;
  color:white;
  font-size:16px;
}

input[type=file]{
  padding:10px;
}

.preview{
  width:130px;
  height:130px;
  object-fit:cover;
  margin-top:15px;
  border-radius:8px;
  border:1px solid #d4af37;
  display:none;
}

button{
  cursor:pointer;
}

.save{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:6px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  font-size:16px;
}

.cancel{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #555;
  border-radius:6px;
  background:#222;
  color:white;
  font-size:15px;
  display:none;
}

.product{
  display:flex;
  align-items:center;
  gap:15px;
  background:#181818;
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
}

.product img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:7px;
}

.info{
  flex:1;
}

.info h3{
  margin-bottom:7px;
}

.price{
  color:#d4af37;
  margin-bottom:5px;
}

.actions{
  display:flex;
  gap:7px;
}

.edit{
  background:#d4af37;
  color:#000;
  border:0;
  padding:9px;
  border-radius:5px;
  font-weight:bold;
}

.delete{
  background:#8b0000;
  color:white;
  border:0;
  padding:9px;
  border-radius:5px;
}

.back{
  display:block;
  text-align:center;
  color:#d4af37;
  margin-top:25px;
  text-decoration:none;
}

@media(max-width:600px){

  body{
    padding:15px;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:65px;
    height:65px;
  }

  .actions{
    flex-direction:column;
  }

  .edit,
  .delete{
    padding:7px;
  }

}

</style>

</head>


<body>

<div class="container">

<h1>👑 AVENZO ADMIN</h1>


<!-- إضافة / تعديل -->

<div class="panel">

<h2 id="formTitle">➕ إضافة منتج</h2>


<label>
اسم المنتج
</label>

<input
  id="name"
  type="text"
  placeholder="مثال: قميص AVENZO"
>


<label>
السعر بالليرة التركية
</label>

<input
  id="price"
  type="number"
  placeholder="750"
>


<label>
القسم
</label>

<select id="category">

<option>رجالي</option>
<option>نسائي</option>
<option>إكسسوارات</option>
<option>جديد</option>
<option>عروض</option>

</select>


<label>
صورة المنتج
</label>

<input
  id="image"
  type="file"
  accept="image/*"
>


<img
  id="preview"
  class="preview"
>


<button
  class="save"
  id="saveButton"
  onclick="saveProduct()">

➕ نشر المنتج

</button>


<button
  class="cancel"
  id="cancelButton"
  onclick="cancelEdit()">

❌ إلغاء التعديل

</button>

</div>


<!-- المنتجات -->

<div class="panel">

<h2>📦 منتجات AVENZO</h2>

<div id="products"></div>

</div>


<a
  class="back"
  href="index.html">

← العودة إلى المتجر

</a>

</div>


<script>

let products =
  JSON.parse(
    localStorage.getItem("avenzoProducts")
  ) || [];


let editingId = null;

let newImage = null;


const imageInput =
  document.getElementById("image");

const preview =
  document.getElementById("preview");


/* =========================
   اختيار صورة
========================= */

imageInput.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

      newImage = e.target.result;

      preview.src = newImage;

      preview.style.display = "block";

    };

    reader.readAsDataURL(file);

  }
);


/* =========================
   حفظ المنتج
========================= */

function saveProduct(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("price")
        .value
    );


  const category =
    document
      .getElementById("category")
      .value;


  if(!name || !price){

    alert("⚠️ اكتب اسم المنتج والسعر");

    return;

  }


  /* =========================
     تعديل منتج
  ========================= */

  if(editingId !== null){

    const product =
      products.find(
        p => p.id === editingId
      );


    if(!product) return;


    product.name = name;

    product.price = price;

    product.category = category;


    /*
      إذا اختار صورة جديدة
      نستبدل الصورة القديمة
    */

    if(newImage){

      product.image = newImage;

    }


    localStorage.setItem(
      "avenzoProducts",
      JSON.stringify(products)
    );


    alert("✅ تم تعديل المنتج");


    cancelEdit();

    renderProducts();

    return;

  }


  /* =========================
     إضافة منتج جديد
  ========================= */

  if(!newImage){

    alert("📸 اختر صورة المنتج");

    return;

  }


  const product = {

    id: Date.now(),

    name: name,

    price: price,

    category: category,

    image: newImage

  };


  products.push(product);


  localStorage.setItem(
    "avenzoProducts",
    JSON.stringify(products)
  );


  alert("✅ تم نشر المنتج في AVENZO");


  clearForm();

  renderProducts();

}


/* =========================
   تعديل المنتج
========================= */

function editProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product) return;


  editingId = id;


  document
    .getElementById("formTitle")
    .textContent =
      "✏️ تعديل المنتج";


  document
    .getElementById("name")
    .value =
      product.name;


  document
    .getElementById("price")
    .value =
      product.price;


  document
    .getElementById("category")
    .value =
      product.category;


  /*
    عرض الصورة الحالية
  */

  preview.src =
    product.image;

  preview.style.display =
    "block";


  /*
    لا نستخدم الصورة القديمة
    كصورة جديدة إلا إذا اختار
    المستخدم صورة أخرى
  */

  newImage = null;


  document
    .getElementById("saveButton")
    .textContent =
      "💾 حفظ التعديل";


  document
    .getElementById("cancelButton")
    .style.display =
      "block";


  /*
    الصعود إلى أعلى الصفحة
  */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   حذف المنتج
========================= */

function deleteProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product) return;


  const confirmDelete =
    confirm(
      "هل تريد حذف \"" +
      product.name +
      "\" ؟"
    );


  if(!confirmDelete) return;


  products =
    products.filter(
      p => p.id !== id
    );


  localStorage.setItem(
    "avenzoProducts",
    JSON.stringify(products)
  );


  renderProducts();

}


/* =========================
   إلغاء التعديل
========================= */

function cancelEdit(){

  editingId = null;

  clearForm();


  document
    .getElementById("formTitle")
    .textContent =
      "➕ إضافة منتج";


  document
    .getElementById("saveButton")
    .textContent =
      "➕ نشر المنتج";


  document
    .getElementById("cancelButton")
    .style.display =
      "none";

}


/* =========================
   تنظيف النموذج
========================= */

function clearForm(){

  document
    .getElementById("name")
    .value = "";


  document
    .getElementById("price")
    .value = "";


  document
    .getElementById("image")
    .value = "";


  preview.src = "";

  preview.style.display =
    "none";


  newImage = null;

}


/* =========================
   عرض المنتجات
========================= */

function renderProducts(){

  const box =
    document.getElementById(
      "products"
    );


  box.innerHTML = "";


  if(products.length === 0){

    box.innerHTML =
      "<p style='color:#888'>لا توجد منتجات حاليًا.</p>";

    return;

  }


  products.forEach(p => {

    box.innerHTML += `

      <div class="product">

        <img src="${p.image}">


        <div class="info">

          <h3>
            ${p.name}
          </h3>

          <div class="price">
            ${Number(p.price).toLocaleString()} ₺
          </div>

          <small>
            ${p.category}
          </small>

        </div>


        <div class="actions">

          <button
            class="edit"
            onclick="editProduct(${p.id})">

            ✏️ تعديل

          </button>


          <button
            class="delete"
            onclick="deleteProduct(${p.id})">

            🗑️ حذف

          </button>

        </div>

      </div>

    `;

  });

}


/* تشغيل */

renderProducts();

</script>

</body>

</html>
